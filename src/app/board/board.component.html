<div class="h-screen w-full flex flex-col gap-6 relative" (click)="boardServ.showEmojiPicker.set(false); boardServ.showEmojiPickerInThreads.set(false)">
    @if (boardServ.profileOptionsOpen()) {
    <div class="fixed top-0 right-0 bottom-0 left-0 bg-black/15 z-5" (click)="boardServ.toggleProfileOptions()"></div>
    }
    <app-board-toolbar></app-board-toolbar>

    <div class="w-full flex justify-between gap-4 flex-1 overflow-hidden relative" [ngStyle]="{'gap.px': boardServ.mobileView() ? '0' : '16'}">
        <app-sidenav class="transition-all duration-75 ease-out"
            [ngStyle]="{'width': boardServ.mobileView() && boardServ.sidenavTranslate() ? '100%' : boardServ.sidenavTranslate() ? '366px' : '0' }"></app-sidenav>

        <app-board-chat-field class="relative h-full w-full flex flex-col justify-start items-start gap-6 flex-1 bg-white rounded-3xl transition-all duration-300 ease-out"
            [ngStyle]="{'display': boardServ.hideChatField() ? 'none' : 'flex'}"></app-board-chat-field>

        <app-thread [class.thread]="boardServ.threadTranslate()" [currentChannel]="firestore.allChannels()[boardServ.idx]"
            [chatMessageIndex]="boardServ.chatMessageIndex" [currentChatMessage]="boardServ.currentChatMessage"
            [ngStyle]="{'width.px': boardServ.threadTranslate() ? '485' : '0',
                        'width': boardServ.threadTranslate() && boardServ.mobileView() ? '100%' : ''}"
            style="transition: all 0.15s cubic-bezier(.215, .61, .355, 1);"></app-thread>
    </div>

    <div (click)="boardServ.open('sidenav')" class="group hide-show-sidebar-btn flex flex-col gap-2.5 rounded-tr-3xl rounded-br-3xl rounded-bl-none rounded-tl-none absolute bottom-0 left-0 h-auto w-16 bg-white px-6 py-3.5 shadow-md cursor-pointer z-9 max-md:hidden hover:opacity-80 transition-opacity">
        <svg [ngStyle]="{'transform': boardServ.sidenavTranslate() ? 'rotate(-180deg)' : ''}" class="w-4.5 h-4.75 hide-show-icon"
            width="18" height="19" viewBox="0 0 18 19" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="1" y="1.5" width="16" height="16" rx="1" stroke="black" stroke-width="2" class="group-hover:stroke-[#535AF1] transition-colors" />
            <path d="M6.71436 1.49997V17.5" stroke="black" stroke-width="2" class="group-hover:stroke-[#535AF1] transition-colors" />
            <path d="M10.143 11.7857L12.0752 9.85354C12.2704 9.65828 12.2704 9.3417 12.0752 9.14644L10.143 7.21428"
                stroke="black" stroke-width="2" stroke-linecap="round" class="group-hover:stroke-[#535AF1] transition-colors" />
        </svg>
        <span class="font-nunito font-medium text-xl group-hover:text-[#535AF1] transition-colors" style="writing-mode: tb-rl; transform: rotate(-180deg);">Workspace Menü {{boardServ.status}}</span>
    </div>

    @if(boardServ.dialogIsOpen()){
    <app-add-channel-dialog></app-add-channel-dialog>
    } @else if(boardServ.editDialogIsOpen()){
    <app-edit-channel-dialog></app-edit-channel-dialog>
    }
    <app-searched-user-pop-up></app-searched-user-pop-up>
</div>
